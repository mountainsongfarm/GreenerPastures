<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: white;
            min-height: 100vh;
        }

        .gallery-content {
            padding-top: 100px;
            padding-bottom: 40px;
            min-height: calc(100vh - 140px);
        }

        .gallery-section {
            background-color: #f5f8f2;
            margin: 40px 0;
            padding: 60px 0;
            border-radius: 15px;
        }

        .gallery-section.no-background {
            background: transparent;
            backdrop-filter: none;
        }

        /* Large Carousel Styles */
        .large-carousel-container {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            margin: 40px 0;
        }

        .large-carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }

        .large-carousel-slide {
            min-width: 100%;
            height: 100%;
        }

        .large-carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .large-carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .large-carousel-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .large-carousel-button.prev {
            left: 20px;
        }

        .large-carousel-button.next {
            right: 20px;
        }

        .large-carousel-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .large-carousel-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .large-carousel-dot.active {
            background: white;
            transform: scale(1.2);
        }

        /* Natural Image Collage Styles */
        .collage-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            padding: 40px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 200px;
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .grid-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* Create interesting layout with varied sized items */
        .grid-item:nth-child(1) { grid-column: 1; grid-row: 1; }
        .grid-item:nth-child(2) { grid-column: 2 / 4; grid-row: 1; }
        .grid-item:nth-child(3) { grid-column: 1; grid-row: 2; }
        .grid-item:nth-child(4) { grid-column: 2; grid-row: 2; }
        .grid-item:nth-child(5) { grid-column: 3; grid-row: 2; }
        .grid-item:nth-child(6) { grid-column: 1 / 3; grid-row: 3; }
        .grid-item:nth-child(7) { grid-column: 3; grid-row: 3; }
        .grid-item:nth-child(8) { grid-column: 1; grid-row: 4; }
        .grid-item:nth-child(9) { grid-column: 2 / 4; grid-row: 4; }
        .grid-item:nth-child(10) { grid-column: 1 / 3; grid-row: 5; }
        .grid-item:nth-child(11) { grid-column: 3; grid-row: 5; }
        .grid-item:nth-child(12) { grid-column: 1; grid-row: 6; }
        .grid-item:nth-child(13) { grid-column: 2; grid-row: 6; }
        .grid-item:nth-child(14) { grid-column: 3; grid-row: 6; }
        .grid-item:nth-child(15) { grid-column: 1 / 3; grid-row: 7; }
        .grid-item:nth-child(16) { grid-column: 3; grid-row: 7; }

        @media (max-width: 768px) {
            .large-carousel-container {
                height: 400px;
            }

            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 150px;
                gap: 10px;
                max-width: 500px;
            }

            .grid-item:nth-child(n) {
                grid-column: auto;
                grid-row: auto;
            }
        }
    </style>
</head>

    <script>
        // Large Carousel Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const track = document.querySelector('.large-carousel-track');
            const slides = Array.from(track.children);
            const nextButton = document.querySelector('.large-carousel-button.next');
            const prevButton = document.querySelector('.large-carousel-button.prev');
            const dotsContainer = document.querySelector('.large-carousel-dots');

            // Create dots
            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.classList.add('large-carousel-dot');
                if (index === 0) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            });

            const dots = Array.from(dotsContainer.children);
            let currentSlide = 0;
            let autoAdvanceTimer;
            let isFirstChange = true;

            function updateSlidePosition() {
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
                
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentSlide);
                });
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                updateSlidePosition();
            }

            function prevSlide() {
                currentSlide = (currentSlide - 1 + slides.length) % slides.length;
                updateSlidePosition();
            }

            function startAutoAdvance() {
                clearTimeout(autoAdvanceTimer);
                const interval = isFirstChange ? 2000 : 12000; // 2 seconds for first change, 12 seconds after
                
                autoAdvanceTimer = setTimeout(() => {
                    nextSlide();
                    isFirstChange = false;
                    startAutoAdvance(); // Continue with longer intervals
                }, interval);
            }

            function resetAutoAdvance() {
                isFirstChange = false;
                startAutoAdvance();
            }

            // Manual navigation event handlers
            nextButton.addEventListener('click', () => {
                nextSlide();
                resetAutoAdvance();
            });

            prevButton.addEventListener('click', () => {
                prevSlide();
                resetAutoAdvance();
            });

            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentSlide = index;
                    updateSlidePosition();
                    resetAutoAdvance();
                });
            });

            // Start auto-advance
            startAutoAdvance();
        });
    </script>

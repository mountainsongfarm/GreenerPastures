        body {
            background-color: white;
            min-height: 100vh;
        }

        .gallery-content {
            padding-top: 100px;
            padding-bottom: 40px;
            min-height: calc(100vh - 140px);
        }

        .gallery-section {
            background-color: #f5f8f2;
            margin: 40px 0;
            padding: 60px 0;
            border-radius: 15px;
        }

        .gallery-section.no-background {
            background: transparent;
            backdrop-filter: none;
        }

        /* Large Carousel Styles */
        .large-carousel-container {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            margin: 40px 0;
        }

        .large-carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }

        .large-carousel-slide {
            min-width: 100%;
            height: 100%;
            background-color: #363d47;
        }

        .large-carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .large-carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .large-carousel-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .large-carousel-button.prev {
            left: 20px;
        }

        .large-carousel-button.next {
            right: 20px;
        }

        .large-carousel-dots {
            display: none;
        }

        /* Natural Image Collage Styles */
        .collage-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            padding: 40px 0;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 200px;
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .grid-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }

        /* Every 5th item spans 2 columns for visual variety */
        .grid-item:nth-child(5n+1) { grid-column: span 2; }

        .grid-item {
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .large-carousel-container {
                height: 400px;
            }

            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 150px;
                gap: 10px;
                max-width: 500px;
            }

            .grid-item:nth-child(n) {
                grid-column: auto;
                grid-row: auto;
            }
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            cursor: default;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 36px;
            cursor: pointer;
            line-height: 1;
            padding: 5px 12px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 48px;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 50%;
            transition: background 0.2s;

        }

            background: rgba(255, 255, 255, 0.1);
        }

    <script>
        // Large Carousel Functionality
        document.addEventListener('DOMContentLoaded', function() {
            const track = document.querySelector('.large-carousel-track');
            const slides = Array.from(track.children);
            const nextButton = document.querySelector('.large-carousel-button.next');
            const prevButton = document.querySelector('.large-carousel-button.prev');
            const dotsContainer = document.querySelector('.large-carousel-dots');

            // Create dots
            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.classList.add('large-carousel-dot');
                if (index === 0) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            });

            const dots = Array.from(dotsContainer.children);
            let currentSlide = 0;
            let autoAdvanceTimer;
            let isFirstChange = true;

            function updateSlidePosition() {
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
                
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentSlide);
                });
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                updateSlidePosition();
            }

            function prevSlide() {
                currentSlide = (currentSlide - 1 + slides.length) % slides.length;
                updateSlidePosition();
            }

            function startAutoAdvance() {
                clearTimeout(autoAdvanceTimer);
                const interval = isFirstChange ? 2000 : 12000; // 2 seconds for first change, 12 seconds after
                
                autoAdvanceTimer = setTimeout(() => {
                    nextSlide();
                    isFirstChange = false;
                    startAutoAdvance(); // Continue with longer intervals
                }, interval);
            }

            function resetAutoAdvance() {
                isFirstChange = false;
                startAutoAdvance();
            }

            // Manual navigation event handlers
            nextButton.addEventListener('click', () => {
                nextSlide();
                resetAutoAdvance();
            });

            prevButton.addEventListener('click', () => {
                prevSlide();
                resetAutoAdvance();
            });

            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentSlide = index;
                    updateSlidePosition();
                    resetAutoAdvance();
                });
            });

            // Start auto-advance
            startAutoAdvance();
        });
    </script>

            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }

            function showNext() {
                currentIndex = (currentIndex + 1) % gridItems.length;
                lightboxImg.src = gridItems[currentIndex].src;
                lightboxImg.alt = gridItems[currentIndex].alt;
            }

            function showPrev() {
                currentIndex = (currentIndex - 1 + gridItems.length) % gridItems.length;
                lightboxImg.src = gridItems[currentIndex].src;
                lightboxImg.alt = gridItems[currentIndex].alt;
            }

            gridItems.forEach((img, i) => {
                img.parentElement.addEventListener('click', () => openLightbox(i));
            });

            closeBtn.addEventListener('click', closeLightbox);
            prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showPrev(); });
            nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(); });
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') showNext();
                if (e.key === 'ArrowLeft') showPrev();
            });
        })();
    </script>

    <script src="/script.js"></script>
</body>
</html>
